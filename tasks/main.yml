---
- name: List backup jobs
  set_fact:
    backup_user: root

    backup_mysql_user: "{{ site_env.db_user | default('') }}"
    backup_mysql_pass: "{{ site_env.db_password | default('') }}"
    backup_mysql_host: "{{ site_env.db_host | default('') }}"

    # Define the backup jobs
    backup_profiles:
      # Backup uploads
      - name: "{{ item.key }}_uploads"
        schedule: "{{ item.value.backup.schedule | default(omit) }}"
        source: "{{ www_root }}/{{ item.key }}/shared/uploads"
        target: "{{ item.value.backup.target }}/uploads"
        target_user: "{{ site_env.backup_target_user | default(false) }}"
        target_pass: "{{ site_env.backup_target_pass | default(false) }}"
        max_age: "{{ item.value.backup.max_age | default('1M') }}"
        full_max_age: "{{ item.value.backup.full_max_age | default('1M') }}"
        max_full_backups: "{{ item.value.backup.max_full_backups | default('1') }}"
        params: "{{ item.value.backup.params | default([]) }}"
        action: "{{ site_purge_backup | ternary('purge_backup --force', 'backup') }}"
        post_actions: "{{ item.value.backup.post_actions | default([]) }}"

      # Backup database
      - name: "{{ item.key }}_database"
        schedule: "{{ item.value.backup.schedule | default(omit) }}"
        source: "mysql://{{ site_env.db_name }}"
        target: "{{ item.value.backup.target }}/database"
        target_user: "{{ site_env.backup_target_user | default(false) }}"
        target_pass: "{{ site_env.backup_target_pass | default(false) }}"
        max_age: "{{ item.value.backup.max_age | default('1M') }}"
        full_max_age: "{{ item.value.backup.full_max_age | default('1M') }}"
        max_full_backups: "{{ item.value.backup.max_full_backups | default('1') }}"
        params: "{{ item.value.backup.params | default([]) }}"
        action: "{{ site_purge_backup | ternary('purge_backup --force', 'backup') }}"
        post_actions: "{{ item.value.backup.post_actions | default([]) }}"

  when: site_uses_backup
  loop: "{{ wordpress_sites | default({}) | dict2items }}"
  register: backup_jobs

- name: Configure backup jobs
  when: backup_jobs.results | selectattr('ansible_facts', 'defined') | list | length > 0
  set_fact:
    backup_profiles: >-
      {{
        (backup_jobs.results
          | selectattr('ansible_facts', 'defined')
          | map(attribute='ansible_facts.backup_profiles.0')
          | list)
        +
        (backup_jobs.results
          | selectattr('ansible_facts', 'defined')
          | map(attribute='ansible_facts.backup_profiles.1')
          | list)
      }}

- name: Run backup role
  include_role:
    name: "lafranceinsoumise.backup"
  vars:
    # The role's own cron task and duplicity version check use non-boolean `when` conditions,
    # which fail on ansible-core 2.19+. The cron entries are created by the next task instead.
    backup_cron: false
    backup_duplicity_version: "{{ trellis_backup_duplicity_version | default(false) }}"
  when: backup_profiles | default([]) | length > 0

- name: Setup backup cron jobs
  cron:
    cron_file: duply_backup
    user: "{{ item.user | default(backup_user) }}"
    job: /usr/bin/duply {{ backup_home | default('/etc/duply') }}/{{ item.name }} {{ item.action | default('backup') }} >> {{ backup_logdir | default('/var/log/duply') }}/{{ item.name }}.log 2>&1
    minute: "{{ item.schedule.split(' ')[0] }}"
    hour: "{{ item.schedule.split(' ')[1] }}"
    day: "{{ item.schedule.split(' ')[2] }}"
    month: "{{ item.schedule.split(' ')[3] }}"
    weekday: "{{ item.schedule.split(' ')[4] }}"
    name: "{{ item.name }}"
  loop: "{{ backup_profiles | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: (item.schedule | default('')) | length > 0
